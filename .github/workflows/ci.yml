name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # For the account e2e tests (e2e/accounts.spec.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon
          POSTGRES_DB: moon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint
      - run: npm run test:tz
      - run: npx playwright install --with-deps chromium webkit
      # Builds the app, serves it with TZ=UTC and a non-English LANG, and
      # fails on any console or hydration error. With E2E_DATABASE_URL set,
      # accounts are switched on and the signed-in flows are tested too.
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://moon:moon@localhost:5432/moon_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
