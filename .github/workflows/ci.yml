name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint
      - run: npm run test:tz
      - run: npx playwright install --with-deps chromium
      # Builds the app, serves it with TZ=UTC and a non-English LANG, and
      # fails on any console or hydration error.
      - run: npm run test:e2e
